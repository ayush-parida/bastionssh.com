services:
  smt:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ghcr.io/your-org/server-management-tool:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      SMT_PORT: 8080
      SMT_DB_URL: /data/smt.db
      SMT_REDIS_URL: redis://redis:6379
      SMT_ENCRYPTION_KEY: ${SMT_ENCRYPTION_KEY:?required}
      SMT_SESSION_SECRET: ${SMT_SESSION_SECRET:?required}
      SMT_CORS_ORIGIN: ${SMT_CORS_ORIGIN:-http://localhost:8080}
      SMT_BASE_URL: ${SMT_BASE_URL:-http://localhost:8080}
      SMT_SFTP_MAX_UPLOAD_BYTES: ${SMT_SFTP_MAX_UPLOAD_BYTES:-1073741824}
      # First-start owner account. Leave the password unset to have a random one
      # generated and printed once in the logs (docker compose logs smt).
      SMT_ADMIN_EMAIL: ${SMT_ADMIN_EMAIL:-ayush.parida@fgshq.com}
      SMT_ADMIN_PASSWORD: ${SMT_ADMIN_PASSWORD:-}
      # Proxies whose X-Forwarded-For is believed: false (default), true, a hop
      # count, or a comma-separated IP/CIDR list. Behind Caddy/Nginx/Traefik set
      # it (usually 1), or every user shares the proxy's IP for rate limiting.
      SMT_TRUST_PROXY: ${SMT_TRUST_PROXY:-false}
      # Passkeys need HTTPS (or localhost). They are bound to the RP ID, which
      # defaults to the hostname of SMT_BASE_URL; set these only to override.
      SMT_WEBAUTHN_RP_ID: ${SMT_WEBAUTHN_RP_ID:-}
      SMT_WEBAUTHN_RP_NAME: ${SMT_WEBAUTHN_RP_NAME:-BastionSSH}
      SMT_WEBAUTHN_ORIGINS: ${SMT_WEBAUTHN_ORIGINS:-}
      # Backups of the app database (smt.db), taken online and kept in the same
      # volume under /data/backups — mount another volume there to keep them
      # off the data disk. Restore: see "Backups & restore" in the README.
      SMT_BACKUP_DIR: ${SMT_BACKUP_DIR:-/data/backups}
      SMT_BACKUP_INTERVAL_HOURS: ${SMT_BACKUP_INTERVAL_HOURS:-24} # 0 = no scheduled backups
      SMT_BACKUP_KEEP: ${SMT_BACKUP_KEEP:-14} # newest kept of each kind
      SMT_BACKUP_GZIP: ${SMT_BACKUP_GZIP:-false}
      # Optional off-site copy (encrypted with SMT_ENCRYPTION_KEY) to an
      # object-storage connection added in the app
      SMT_BACKUP_STORAGE_CONNECTION_ID: ${SMT_BACKUP_STORAGE_CONNECTION_ID:-}
      SMT_BACKUP_STORAGE_BUCKET: ${SMT_BACKUP_STORAGE_BUCKET:-}
      SMT_BACKUP_STORAGE_PREFIX: ${SMT_BACKUP_STORAGE_PREFIX:-bastionssh-backups/}
    volumes:
      - smt-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  smt-data:
  redis-data:
