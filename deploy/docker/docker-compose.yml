# Default:      docker compose up -d                  → http://localhost:8080
# With HTTPS:   docker compose --profile https up -d  → https://$SMT_DOMAIN
#
# The https profile adds Caddy, which gets and renews a certificate for
# SMT_DOMAIN automatically (Let's Encrypt / ZeroSSL) and proxies to smt. Set
# these in deploy/docker/.env first (docker compose reads it from here):
#
#   SMT_DOMAIN=bastion.example.com            # DNS must point here; ports 80+443 reachable
#   SMT_BASE_URL=https://bastion.example.com  # passkeys are bound to this hostname
#   SMT_TRUST_PROXY=1                         # believe Caddy's X-Forwarded-For (one hop)
#   SMT_HTTP_BIND=127.0.0.1:8080              # keep plain HTTP off the network
#   SMT_ACME_EMAIL=you@example.com            # optional: expiry notices from the CA
#
# Caddy refuses to start until SMT_BASE_URL is https://$SMT_DOMAIN,
# SMT_TRUST_PROXY is set and SMT_HTTP_BIND is a loopback address: the first
# mistake breaks passkeys, the second makes every user share Caddy's IP for
# rate limits and the audit log, the third lets anyone reach smt directly and
# claim any client address in X-Forwarded-For.
services:
  smt:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ghcr.io/ayush-parida/bastionssh:latest
    restart: unless-stopped
    ports:
      # 127.0.0.1:8080 with the https profile, so only Caddy (and this host) can reach it
      - "${SMT_HTTP_BIND:-8080}:8080"
    environment:
      NODE_ENV: production
      SMT_PORT: 8080
      SMT_DB_URL: /data/smt.db
      SMT_REDIS_URL: redis://redis:6379
      SMT_ENCRYPTION_KEY: ${SMT_ENCRYPTION_KEY:?required}
      SMT_SESSION_SECRET: ${SMT_SESSION_SECRET:?required}
      SMT_CORS_ORIGIN: ${SMT_CORS_ORIGIN:-http://localhost:8080}
      SMT_BASE_URL: ${SMT_BASE_URL:-http://localhost:8080}
      SMT_SFTP_MAX_UPLOAD_BYTES: ${SMT_SFTP_MAX_UPLOAD_BYTES:-1073741824}
      # First-start owner account. Leave the password unset to have a random one
      # generated and printed once in the logs (docker compose logs smt).
      SMT_ADMIN_EMAIL: ${SMT_ADMIN_EMAIL:-ayush.parida@fgshq.com}
      SMT_ADMIN_PASSWORD: ${SMT_ADMIN_PASSWORD:-}
      # Proxies whose X-Forwarded-For is believed: false (default), true, a hop
      # count, or a comma-separated IP/CIDR list. Behind Caddy/Nginx/Traefik set
      # it (usually 1), or every user shares the proxy's IP for rate limiting.
      SMT_TRUST_PROXY: ${SMT_TRUST_PROXY:-false}
      # This app's public IP, shown by connectivity diagnostics as the source a
      # firewall must allow. Unset = look it up from IP echo services (cached
      # 10 min); an IP = use it; `off` = never look it up.
      SMT_EGRESS_IP: ${SMT_EGRESS_IP:-}
      # Passkeys need HTTPS (or localhost). They are bound to the RP ID, which
      # defaults to the hostname of SMT_BASE_URL; set these only to override.
      SMT_WEBAUTHN_RP_ID: ${SMT_WEBAUTHN_RP_ID:-}
      SMT_WEBAUTHN_RP_NAME: ${SMT_WEBAUTHN_RP_NAME:-BastionSSH}
      SMT_WEBAUTHN_ORIGINS: ${SMT_WEBAUTHN_ORIGINS:-}
      # Backups of the app database (smt.db), taken online and kept in the same
      # volume under /data/backups — mount another volume there to keep them
      # off the data disk. Restore: see "Backups & restore" in the README.
      SMT_BACKUP_DIR: ${SMT_BACKUP_DIR:-/data/backups}
      SMT_BACKUP_INTERVAL_HOURS: ${SMT_BACKUP_INTERVAL_HOURS:-24} # 0 = no scheduled backups
      SMT_BACKUP_KEEP: ${SMT_BACKUP_KEEP:-14} # newest kept of each kind
      SMT_BACKUP_GZIP: ${SMT_BACKUP_GZIP:-false}
      # Optional off-site copy (encrypted with SMT_ENCRYPTION_KEY) to an
      # object-storage connection added in the app
      SMT_BACKUP_STORAGE_CONNECTION_ID: ${SMT_BACKUP_STORAGE_CONNECTION_ID:-}
      SMT_BACKUP_STORAGE_BUCKET: ${SMT_BACKUP_STORAGE_BUCKET:-}
      SMT_BACKUP_STORAGE_PREFIX: ${SMT_BACKUP_STORAGE_PREFIX:-bastionssh-backups/}
      # Email for alerts and account notices (new-device sign-ins, failed sign-ins)
      SMT_SMTP_URL: ${SMT_SMTP_URL:-}
      SMT_SMTP_FROM: ${SMT_SMTP_FROM:-}
      # Private networks audit-log forwarding (syslog/webhook) may reach, e.g. 10.0.0.0/8
      SMT_AUDIT_FORWARD_ALLOW_NETS: ${SMT_AUDIT_FORWARD_ALLOW_NETS:-}
    volumes:
      - smt-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Only with --profile https: TLS termination with automatic certificates
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SMT_DOMAIN: ${SMT_DOMAIN:-}
      SMT_BASE_URL: ${SMT_BASE_URL:-http://localhost:8080}
      SMT_TRUST_PROXY: ${SMT_TRUST_PROXY:-false}
      SMT_HTTP_BIND: ${SMT_HTTP_BIND:-}
      SMT_ACME_EMAIL: ${SMT_ACME_EMAIL:-}
    entrypoint: ["/bin/sh", "/etc/caddy/check-env.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/check-env.sh:/etc/caddy/check-env.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      smt:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  smt-data:
  redis-data:
  # Caddy's certificates and ACME account; keep it, or every restart re-issues
  caddy-data:
  caddy-config:
